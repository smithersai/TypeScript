# Install releases at least seven days old, except the exact VibeLang, Effect and test-tool pins.
[install]
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = ["vibelang", "vibelang-runtime", "vibelang-vite", "vibelang-darwin-arm64", "vibelang-darwin-x64", "vibelang-linux-arm64", "vibelang-linux-x64", "effect", "@effect/platform-browser", "@effect/vitest", "vitest", "@vitest/mocker", "@vitest/spy"]
